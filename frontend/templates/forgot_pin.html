<!-- templates/forgot_pin.html -->
{% extends 'base.html' %}

{% block title %}Reset PIN - RainBank{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <i class="fas fa-key text-earth text-5xl mb-4"></i>
            <h1 class="text-2xl font-bold">Reset Your PIN</h1>
            <p class="text-gray-600 text-sm mt-2">We'll send a reset code to your phone</p>
        </div>
        
        <form method="POST" action="{% url 'core:forgot_pin' %}">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Phone Number</label>
                <input type="tel" name="phone" placeholder="0712345678" required 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-earth focus:border-earth">
            </div>
            
            <button type="submit" class="w-full bg-earth hover:bg-earth-dark text-white font-bold py-3 rounded-lg transition">
                Send Reset Code <i class="fas fa-paper-plane ml-2"></i>
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-600 mt-6">
            Remember your PIN? <a href="{% url 'core:login' %}" class="text-earth hover:underline">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
